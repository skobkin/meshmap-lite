mqtt:
  host: localhost
  port: 1883
  # Optional: stable MQTT client ID. If omitted, app derives one from hostname + root topic.
  client_id: ""
  root_topic: msh/RU/ARKH
  protocol_version: 3.1.1
  username: "user1" # mqtt username
  password: "12345" ## mqtt password
  subscribe_qos: 1
  clean_session: false
  reconnect_timeout: 10s
  connect_timeout: 10s
  keepalive: 60s

ingest:
  map_reports:
    enabled: true
    topic_suffix: 2/map
  traceroute:
    timeout: 60s
    max_entries: 1000
    final_retention: 60s

storage:
  kv:
    driver: memory
    size: 100000
    ttl: 6h
  sql:
    driver: sqlite
    url: ./data/db.sqlite
    auto_migrate: true
    # 0 disables row-cap pruning.
    log_max_rows: 50000
    # Number of rows allowed above cap before prune runs. Prune always shrinks back to log_max_rows.
    log_prune_batch_rows: 1000

channels:
  LongFast:
    psk: AQ==
    events: [text_message, node_info, position, telemetry]
    primary: true
  PingPong:
    psk: AQ==
    events: [text_message]
    primary: false

web:
  listen_addr: :8080
  info:
    # Optional Markdown file loaded once at startup and shown as an acknowledgement modal.
    # Prefer an absolute path in deployments. Empty disables the feature.
    file: ""
  chat:
    enabled: true
    default_channel: LongFast
    show_recent_messages: 50
    history_window: 168h
  ws:
    heartbeat_interval: 30s
    stats_interval: 60s
  map:
    clustering: false
    disconnected_threshold: 60m
    topology_cache_ttl: 10m
    topology_max_edges: 2000
    precision_circles_mode: selected
    default_view:
      latitude: 64.5
      longitude: 40.6
      zoom: 13
  relevance:
    telemetry_max_age: 24h
    topology_evidence_max_age: 72h
    map_position_max_age: 336h
  log:
    live_updates: true
    page_size_default: 100
  stats:
    activity:
      daily:
        bucket: 5m
      weekly:
        bucket: 1h
    software:
      snapshot_cache_ttl: 1h    # how long the current-fleet distribution is reused
      history_cache_ttl: 24h    # how long the per-week history chart is reused
      history_weeks: 54         # default 1 year at weekly precision
      top_versions: 15          # versions rendered individually; rest go into "(other)"
      # Exclude nodes that haven't sent a MapReport in this window from both
      # the snapshot bar chart and the weekly history job (write-time gate).
      # Once a row is in node_firmware_history, it stays — the history area
      # chart's read path does not re-filter at query time.
      map_report_max_age: 336h  # 14d
    hardware:
      snapshot_cache_ttl: 1h    # how long the current-fleet model distribution is reused
      history_cache_ttl: 24h    # how long the per-week model history chart is reused
      history_weeks: 54         # default 1 year at weekly precision
      top_models: 15            # models rendered individually; rest go into "(other)"
      # Exclude nodes that haven't been seen on any event in this window from
      # both the snapshot bar chart and the weekly history job (write-time
      # gate). Hardware arrives with NodeInfo and covers nearly every known
      # node, so this gates last_seen_any_event_at (the broadest liveness
      # column), not the MapReport-only timestamp the software block uses.
      # Once a row is in node_hardware_history, it stays — the history area
      # chart's read path does not re-filter at query time.
      max_age: 336h            # 14d

logging:
  level: info

update_check:
  enabled: true
  interval: 12h
  timeout: 15s
  sources:
    - name: meshmap-lite
      label: Map
      type: forgejo
      base_url: https://git.skobk.in
      repository: skobkin/meshmap-lite
      current_version_source: buildinfo
      limit: 15
      # Post-process release Markdown before caching it. This links commit
      # hashes, #issue/#PR references, full issue/PR URLs, and @user refs.
      # Set to false to keep upstream release bodies unchanged.
      post_process: true
    # GitHub release sources are also supported for public repositories.
    # - name: meshtastic-firmware
    #   label: Meshtastic FW
    #   type: github
    #   repository: meshtastic/firmware
    #   limit: 15
    # Set pre_releases: true to include alpha/beta/RC releases. Defaults to
    # false (stable releases only). Forgejo stable-only mode sends
    # pre-release=false; GitHub prereleases are filtered per release.
    # - name: meshtastic-firmware-prereleases
    #   type: github
    #   repository: meshtastic/firmware
    #   pre_releases: true
    #   post_process: true
    #   limit: 15
